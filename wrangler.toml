# ওয়ার্কারের নাম (যেকোনো নাম দিন)
name = "proxy"

# মূল ফাইল (যে ফাইলে এই কোডটি আছে)
main = "worker.js"

# সামঞ্জস্যপূর্ণ তারিখ (সর্বশেষ একটি দিন)
compatibility_date = "2024-12-18"

# (ঐচ্ছিক) যদি আপনার কোনো কাস্টম ডোমেইন বা রাউট থাকে, তবে নিচের মত করে দিন
# routes = [
#   { pattern = "your-domain.com/*", zone_id = "your-zone-id" }
# ]

# (ঐচ্ছিক) পরিবেশ ভেরিয়েবল ব্যবহার করলে এখানে দিন
# [vars]
# SOME_VAR = "value"
